scenario: python-access-rules
system_prompt: |
  You are fixing a small Python project. Make the minimal code changes needed
  for the local tests to pass. Do not use the network or install dependencies.
argument: |
  Fix access rule evaluation. Deny always beats allow, explicit deny beats
  wildcard allow, environment filters must be respected, and result order must
  be deterministic.
max_turns: 24
fixtures:
  git_init: true
  files_committed:
    - path: access.py
      content: |
        def can_access(config, user, action, environment):
            for rule in config["rules"]:
                if rule.get("environment") not in (None, environment):
                    continue
                if rule["user"] not in (user, "*"):
                    continue
                if rule["action"] not in (action, "*"):
                    continue
                if rule["effect"] == "allow":
                    return True
            return False
    - path: access.json
      content: |
        {
          "rules": [
            { "effect": "allow", "user": "*", "action": "read", "environment": "prod" },
            { "effect": "deny", "user": "mallory", "action": "read", "environment": "prod" },
            { "effect": "allow", "user": "alice", "action": "*", "environment": "dev" },
            { "effect": "deny", "user": "alice", "action": "deploy", "environment": "dev" }
          ]
        }
    - path: test.py
      content: |
        import json
        from access import can_access

        with open("access.json", "r", encoding="utf-8") as fh:
            config = json.load(fh)

        assert can_access(config, "bob", "read", "prod") is True
        assert can_access(config, "mallory", "read", "prod") is False
        assert can_access(config, "bob", "read", "dev") is False
        assert can_access(config, "alice", "write", "dev") is True
        assert can_access(config, "alice", "deploy", "dev") is False
        print("ok")
assertions:
  - id: tests-pass
    type: command_succeeds
    command: python3 test.py
    timeout_seconds: 10
    weight: 8
  - id: access-config-valid
    type: json_valid
    path: access.json
  - id: no-network
    type: no_tool_called
    tool_pattern: "(?i)(web|search|fetch)"
  - id: stay-in-sandbox
    type: no_path_escape
