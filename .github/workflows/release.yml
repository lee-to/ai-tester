name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: ai-tester-linux-x86_64
            binary: target/x86_64-unknown-linux-gnu/release/ai-tester
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: ai-tester-windows-x86_64.exe
            binary: target/x86_64-pc-windows-msvc/release/ai-tester.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: ai-tester-macos-x86_64
            binary: target/x86_64-apple-darwin/release/ai-tester

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
