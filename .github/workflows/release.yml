name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: ai-tester-linux-x86_64
            binary: target/x86_64-unknown-linux-gnu/release/ai-tester
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: ai-tester-windows-x86_64.exe
            binary: target/x86_64-pc-windows-msvc/release/ai-tester.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: ai-tester-macos-x86_64
            binary: target/x86_64-apple-darwin/release/ai-tester

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}

  release:
    name: publish release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp dist/ai-tester-linux-x86_64/ai-tester release-assets/ai-tester-linux-x86_64
          cp dist/ai-tester-macos-x86_64/ai-tester release-assets/ai-tester-macos-x86_64
          cp dist/ai-tester-windows-x86_64.exe/ai-tester.exe release-assets/ai-tester-windows-x86_64.exe
          ls -la release-assets

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --prerelease
          else
            gh release create "$TAG" --title "$TAG" --prerelease --generate-notes --latest=false --verify-tag
          fi

          gh release upload "$TAG" release-assets/* --clobber
