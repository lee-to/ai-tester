[package]
name = "ai-tester"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Native Rust behavioral test harness for agent skills and prompts"
repository = "https://github.com/lee-to/ai-tester"

[[bin]]
name = "ai-tester"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
camino = { version = "1.2", features = ["serde1"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
owo-colors = "4.3"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.23"
thiserror = "2.0"
tokio = { version = "1.52", features = ["io-util", "macros", "process", "rt-multi-thread", "time"] }
walkdir = "2.5"
yaml_serde = "0.10"

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
